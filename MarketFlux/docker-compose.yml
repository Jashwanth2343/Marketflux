# MarketFlux - local/production compose
#
# `docker compose up --build` starts the full stack:
#   backend  -> FastAPI on :8000
#   frontend -> React on :3000
#   mongo    -> required primary data layer (auth sessions, trades, portfolios,
#               copilot/pilot state). The backend fails fast with a clear error
#               if MONGO_URL is unset.
#   redis    -> shared cache + rate-limiter backend (optional but recommended;
#               the app degrades gracefully without it).
#
# Copy backend/.env.example to backend/.env and fill in API keys before the
# first run. Compose provides the infrastructure URLs below; your .env only
# needs the secrets (GEMINI_API_KEY, APCA_*, SUPABASE_*, ...).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost}
      - PORT=${PORT:-8000}
      # Infrastructure wiring (override in .env only if you run these externally)
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:-marketflux}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
